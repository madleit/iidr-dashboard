<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>IIDR CDC Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header>
    <h1>IIDR CDC Dashboard</h1>
    <div class="bar">
      <label>Usuário <input id="user" value="labuser"></label>
      <label>Ambiente <select id="env"></select></label>
      <button onclick="refreshAll()">Atualizar</button>
    </div>
  </header>
  <main>
    <section class="cards" id="cards"></section>
    <section><h2>Replication Monitor</h2><div id="monitor"></div></section>
    <section><h2>Subscriptions</h2><div id="subscriptions"></div></section>
    <section><h2>Datastores</h2><div id="datastores"></div></section>
    <section>
      <h2>Detalhes / Eventos</h2>
      <div class="bar">
        <input id="subname" placeholder="Subscription ex: SYSLAB">
        <button onclick="loadDetails()">Detalhes</button>
        <button onclick="loadEvents('source')">Eventos Source</button>
        <button onclick="loadEvents('target')">Eventos Target</button>
      </div>
      <pre id="details"></pre>
    </section>
    <section>
      <h2>Operações</h2>
      <div class="bar">
        <input id="opsub" placeholder="Subscription ex: SYSLAB">
        <button class="danger" onclick="startMirroring()">Start Mirroring</button>
        <button class="danger" onclick="stopMirroring()">End Replication</button>
      </div>
      <pre id="operation"></pre>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
